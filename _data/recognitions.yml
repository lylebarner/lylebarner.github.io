# Recognitions
- award: Group Achievement Awards
  organization: NASA
  year: Aug. 2019, Jun. 2024
  summary: Presented to any combination of government and/or non-government individuals for an outstanding group achievement that has contributed substantially to NASA's mission

- award: Discovery and Team Awards
  organization: Jet Propulsion Laboratory
  year: May 2017, Sept. 2017, Sept. 2018
  summary: Presented for making a difference to the operational effectiveness and/or technical capabilities of the organization.

- award: Performance Reward Program Awards
  organization: Northrop Grumman
  year: Dec. 2015, Apr. 2016
  summary: Presented for commitment to excellence and significant contributions to successful contract execution.
